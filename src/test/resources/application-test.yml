spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true

jwt: # Corrected to match application.yml property names
  secret: testSecretKeyWithAtLeast256BitsForHMACAlgorithmTestingPurposesOnly12345
  expiration: 3600000 # 1 hour in milliseconds, matching the unit in application.yml

cors:
  allowed-origins: "*"
